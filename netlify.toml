[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install --omit=dev"

[build.environment]
  NODE_VERSION = "20"
  VIEWS_START_AT = "3635"

[functions]
  node_bundler = "esbuild"
  # Required so Blobs share state across functions (nowplaying → listening)
  external_node_modules = ["@netlify/blobs"]
  included_files = ["netlify/functions/**", "lib/**", "assets/ytmusic-bridge.user.js", "assets/ytmusic-bridge-bookmark.js"]

[[redirects]]
  from = "/api/views"
  to = "/.netlify/functions/views"
  status = 200
  force = true

[[redirects]]
  from = "/api/badges"
  to = "/.netlify/functions/badges"
  status = 200
  force = true

[[redirects]]
  from = "/api/discord"
